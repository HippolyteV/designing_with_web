<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pairz Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <nav class="sidebar">
        <h1>PAIRZ</h1>
        <ul>
            <li>SHOES GALLERY</li>
            <li>MEN</li>
            <li>WOMEN</li>
            <li>KIDS</li>
            <li class="red-text">DEALS</li>
        </ul>
        <div class="filter-bar">
            FILTER AND SORT <i data-lucide="chevron-down"></i></div>
    </nav>

    <main class="content">
        <header class="top-bar">
            <div class="cart-wrapper">
                <i data-lucide="shopping-cart"></i>
                <span>CART</span>
            </div>
        </header>
        <section class="grid" id="products-grid"></section>
    </main>

    <!-- PROMPT : "Où est-ce que je dois placer le code HTML de mes modales générées en JS pour éviter les conflits avec ma grille ?"
    RÉPONSE GEMINI : "Création d'un div #popovers-container en fin de body pour isoler les éléments interactifs du contenu principal."-->

    <div id="popovers-container"></div>

</body>
</html>
